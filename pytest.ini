
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts = -v -s --self-contained-html

markers =
    smoke: quick critical-path checks, run first
    regression: full regression coverage
    parallel: safe to run in parallel with pytest-xdist (-n auto)
    xdist_group: keeps grouped tests on one xdist worker, in file order
