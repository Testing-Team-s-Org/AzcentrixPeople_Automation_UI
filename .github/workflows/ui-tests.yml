name: UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      marker:
        description: "Which tests to run"
        required: false
        default: "smoke"
        type: choice
        options: ["smoke", "regression", "all"]
      browser:
        description: "Browser to run on"
        required: false
        default: "chrome"
        type: choice
        options: ["chrome", "firefox"]

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60

    # Credentials come from repository secrets. conftest.py reads them from the
    # environment, so no .env file is needed on the runner.
    env:
      LOGIN_COMPANY_CODE: ${{ secrets.LOGIN_COMPANY_CODE }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      # Empty on push / pull_request (the defaults are applied in the run step)
      INPUT_MARKER: ${{ inputs.marker }}
      INPUT_BROWSER: ${{ inputs.browser }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium firefox

      - name: Run tests
        shell: pwsh
        run: |
          # push / pull_request: smoke on chrome. Manual runs use the chosen inputs.
          $marker = if ($env:INPUT_MARKER) { $env:INPUT_MARKER } else { "smoke" }
          $browser = if ($env:INPUT_BROWSER) { $env:INPUT_BROWSER } else { "chrome" }
          if ($marker -eq "all") { $marker = "" }

          python -m pytest tests -m "$marker" --browser_name=$browser
          exit $LASTEXITCODE

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
